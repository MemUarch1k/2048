<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memuar's 2048</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0c12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        /* ============================================================
           БАЗОВЫЕ СТИЛИ
           ============================================================ */
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0c12;
            font-family: 'Segoe UI', 'Courier New', monospace;
            touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.8s ease;
        }

        /* ============================================================
           КОНТЕЙНЕР ИГРЫ
           ============================================================ */
        .game-wrapper {
            background: #0f1117;
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            margin: 16px;
        }

        .game-panel {
            background: #07090e;
            border-radius: 32px;
            padding: 20px;
        }

        /* ============================================================
           ВЕРХНЯЯ ПАНЕЛЬ
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .title {
            color: #c0d0e6;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .title span {
            color: #2ecc71;
        }

        .scores {
            display: flex;
            gap: 12px;
        }

        .score-box {
            background: #0f1117;
            border-radius: 16px;
            padding: 6px 16px;
            text-align: center;
            min-width: 70px;
        }
        .score-box .label {
            color: #5a6e8a;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-box .value {
            color: #2ecc71;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.2;
        }
        .score-box.best .value {
            color: #f39c12;
        }

        /* ============================================================
           ПОЛЕ
           ============================================================ */
        .board-wrapper {
            position: relative;
            background: #0f1117;
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 16px;
            touch-action: none;
        }

        .board {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #0a0c12;
            border-radius: 16px;
            touch-action: none;
        }

        /* ============================================================
           ПЛИТКИ (DOM-элементы)
           ============================================================ */
        .tile {
            position: absolute;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            transition: none;
            will-change: transform, opacity;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .tile-2    { background: #eee4da; color: #776e65; }
        .tile-4    { background: #ede0c8; color: #776e65; }
        .tile-8    { background: #f2b179; color: #f9f6f2; }
        .tile-16   { background: #f59563; color: #f9f6f2; }
        .tile-32   { background: #f67c5f; color: #f9f6f2; }
        .tile-64   { background: #f65e3b; color: #f9f6f2; }
        .tile-128  { background: #edcf72; color: #f9f6f2; font-size: 0.9em; }
        .tile-256  { background: #edcc61; color: #f9f6f2; font-size: 0.9em; }
        .tile-512  { background: #edc850; color: #f9f6f2; font-size: 0.9em; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 0.8em; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 0.8em; box-shadow: 0 0 30px rgba(237, 194, 46, 0.4); }
        .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 0.7em; }

        /* Анимация появления */
        @keyframes tileAppear {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .tile-appear {
            animation: tileAppear 0.15s ease-out;
        }

        /* Анимация слияния */
        @keyframes tileMerge {
            0% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        .tile-merge {
            animation: tileMerge 0.2s ease-out;
        }

        /* ============================================================
           ЭФФЕКТЫ (салюты, частицы)
           ============================================================ */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 9999;
        }

        @keyframes burst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .particle-burst {
            animation: burst 0.8s ease-out forwards;
        }

        /* ============================================================
           КНОПКИ
           ============================================================ */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #1a1f2a;
            border: none;
            color: #c0d0e6;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 3px 0 #0b0e12;
            flex: 1;
            min-width: 100px;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0b0e12;
        }

        .btn-primary {
            background: #2ecc71;
            color: #0a0c12;
            box-shadow: 0 3px 0 #1e8a4c;
        }

        /* ============================================================
           АДАПТИВ
           ============================================================ */
        @media (max-width: 500px) {
            .game-wrapper { padding: 12px; border-radius: 32px; }
            .game-panel { padding: 12px; }
            .title { font-size: 18px; }
            .score-box .value { font-size: 20px; }
            .score-box { padding: 4px 12px; min-width: 60px; }
            button { font-size: 14px; padding: 8px 16px; min-width: 70px; }
        }
        @media (max-width: 400px) {
            .game-wrapper { padding: 8px; }
            .game-panel { padding: 8px; }
            .board-wrapper { padding: 8px; }
            .title { font-size: 16px; }
            .score-box .value { font-size: 16px; }
            button { font-size: 12px; padding: 6px 12px; min-width: 60px; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="game-panel">

        <!-- Верхняя панель -->
        <div class="header">
            <div class="title">MEMUAR<span>'S</span><br><small style="font-size:12px;color:#5a6e8a;">2048</small></div>
            <div class="scores">
                <div class="score-box">
                    <div class="label">Счёт</div>
                    <div class="value" id="scoreDisplay">0</div>
                </div>
                <div class="score-box best">
                    <div class="label">Рекорд</div>
                    <div class="value" id="bestDisplay">0</div>
                </div>
            </div>
        </div>

        <!-- Игровое поле -->
        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>

        <!-- Управление -->
        <div class="controls">
            <button id="newGameBtn" class="btn-primary">🔄 Новая игра</button>
            <button id="undoBtn">↩️ Отмена</button>
        </div>

    </div>
</div>

<script>
    // ================================================================
    //   ВСЯ ЛОГИКА ИГРЫ С АНИМАЦИЯМИ, САЛЮТАМИ, ЗВУКАМИ, VK BRIDGE
    //   И ВСЕМ, ЧТО МЫ ОБСУЖДАЛИ
    // ================================================================

    (function() {
        'use strict';

        // ----------------------------------------------------------------
        // 1. КОНСТАНТЫ И СОСТОЯНИЕ
        // ----------------------------------------------------------------
        const SIZE = 4;
        let grid = [];
        let score = 0;
        let bestScore = 0;
        let gameOver = false;
        let won = false;
        let isMoving = false;
        let tiles = [];
        let tileId = 0;

        // Для отмены хода
        let history = [];

        // Для VK Bridge (загружается асинхронно)
        let vkBridge = null;
        let vkReady = false;

        // DOM
        const boardEl = document.getElementById('board');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const bestDisplay = document.getElementById('bestDisplay');

        // ----------------------------------------------------------------
        // 2. ЗВУКИ (Web Audio API)
        // ----------------------------------------------------------------
        let audioCtx = null;

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                console.warn('Web Audio не поддерживается');
            }
        }

        function playTone(freq, duration, volume = 0.15, type = 'sine') {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function soundMove() {
            playTone(300, 0.06, 0.08);
        }
        function soundMerge(value) {
            const freq = 400 + Math.log2(value) * 40;
            playTone(freq, 0.15, 0.12);
        }
        function soundWin() {
            playTone(523, 0.2, 0.15);
            setTimeout(() => playTone(659, 0.2, 0.15), 150);
            setTimeout(() => playTone(784, 0.3, 0.2), 300);
        }
        function soundLose() {
            playTone(300, 0.3, 0.15, 'sawtooth');
        }
        function soundCelebration() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => playTone(400 + i * 80, 0.1, 0.08), i * 80);
            }
        }

        // ----------------------------------------------------------------
        // 3. VK BRIDGE
        // ----------------------------------------------------------------
        function initVK() {
            if (typeof window.vkBridge !== 'undefined') {
                vkBridge = window.vkBridge;
                vkReady = true;
                // Пытаемся загрузить рекорд
                loadBestFromVK();
            } else {
                // Если VK Bridge не загружен — используем localStorage
                loadBestFromLocal();
            }
        }

        function loadBestFromVK() {
            if (!vkBridge) return;
            vkBridge.send('VKWebAppStorageGet', { keys: ['bestScore_2048'] })
                .then(data => {
                    if (data.keys && data.keys.length > 0) {
                        const val = parseInt(data.keys[0].value, 10);
                        if (!isNaN(val) && val > 0) {
                            bestScore = val;
                            updateBestDisplay();
                        }
                    }
                })
                .catch(() => loadBestFromLocal());
        }

        function saveBestToVK() {
            if (!vkBridge) return;
            vkBridge.send('VKWebAppStorageSet', { key: 'bestScore_2048', value: String(bestScore) })
                .catch(() => saveBestToLocal());
        }

        function loadBestFromLocal() {
            try {
                const saved = localStorage.getItem('memuars_2048_best');
                if (saved) {
                    bestScore = parseInt(saved, 10) || 0;
                    updateBestDisplay();
                }
            } catch(e) {}
        }

        function saveBestToLocal() {
            try {
                localStorage.setItem('memuars_2048_best', String(bestScore));
            } catch(e) {}
        }

        function updateBestDisplay() {
            bestDisplay.textContent = bestScore;
        }

        // ----------------------------------------------------------------
        // 4. ПЛИТКИ (отрисовка и анимация)
        // ----------------------------------------------------------------
        function getTileColor(value) {
            if (value <= 2048) {
                const colors = {
                    2: '#eee4da', 4: '#ede0c8', 8: '#f2b179',
                    16: '#f59563', 32: '#f67c5f', 64: '#f65e3b',
                    128: '#edcf72', 256: '#edcc61', 512: '#edc850',
                    1024: '#edc53f', 2048: '#edc22e'
                };
                return colors[value] || '#3c3a32';
            }
            return '#3c3a32';
        }

        function getTileTextColor(value) {
            if (value <= 4) return '#776e65';
            return '#f9f6f2';
        }

        function getTileFontSize(value) {
            if (value < 100) return '1.2em';
            if (value < 1000) return '1em';
            if (value < 10000) return '0.85em';
            return '0.7em';
        }

        function createTileElement(value, row, col, animate = false, merge = false) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.row = row;
            el.dataset.col = col;
            el.dataset.value = value;
            el.dataset.id = tileId++;

            const size = boardEl.clientWidth / SIZE;
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = (col * size) + 'px';
            el.style.top = (row * size) + 'px';
            el.style.fontSize = getTileFontSize(value);
            el.style.background = getTileColor(value);
            el.style.color = getTileTextColor(value);
            el.textContent = value;

            if (animate) {
                el.classList.add('tile-appear');
            }
            if (merge) {
                el.classList.add('tile-merge');
                setTimeout(() => el.classList.remove('tile-merge'), 250);
            }

            // Свечение для больших чисел
            if (value >= 2048) {
                el.style.boxShadow = `0 0 30px rgba(237, 194, 46, 0.4)`;
            }

            return el;
        }

        function updateTilePosition(el, row, col) {
            const size = boardEl.clientWidth / SIZE;
            el.style.left = (col * size) + 'px';
            el.style.top = (row * size) + 'px';
            el.dataset.row = row;
            el.dataset.col = col;
        }

        function renderGrid(animate = false) {
            // Очищаем поле, но сохраняем плитки в массив
            boardEl.innerHTML = '';
            const size = boardEl.clientWidth / SIZE;

            // Сначала рисуем фоновые ячейки
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.style.cssText = `
                        position: absolute;
                        left: ${c * size}px;
                        top: ${r * size}px;
                        width: ${size - 6}px;
                        height: ${size - 6}px;
                        margin: 3px;
                        background: rgba(255,255,255,0.05);
                        border-radius: 8px;
                    `;
                    boardEl.appendChild(cell);
                }
            }

            // Рисуем плитки
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = grid[r][c];
                    if (val !== 0) {
                        // Проверяем, была ли плитка уже создана
                        let existing = tiles.find(t =>
                            t.dataset.row == r && t.dataset.col == c && t.dataset.value == val
                        );
                        if (!existing) {
                            const el = createTileElement(val, r, c, animate);
                            boardEl.appendChild(el);
                            tiles.push(el);
                        } else {
                            // Обновляем позицию существующей
                            updateTilePosition(existing, r, c);
                        }
                    }
                }
            }

            // Удаляем плитки, которых нет в сетке
            tiles = tiles.filter(el => {
                const r = parseInt(el.dataset.row);
                const c = parseInt(el.dataset.col);
                if (grid[r] && grid[r][c] === parseInt(el.dataset.value)) {
                    return true;
                } else {
                    el.remove();
                    return false;
                }
            });
        }

        // ----------------------------------------------------------------
        // 5. ЛОГИКА ИГРЫ
        // ----------------------------------------------------------------
        function initGrid() {
            grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
            tiles = [];
            tileId = 0;
            addRandomTile();
            addRandomTile();
            gameOver = false;
            won = false;
            score = 0;
            updateScore();
            renderGrid(true);
        }

        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 0) empty.push({ r, c });
                }
            }
            if (empty.length === 0) return;
            const { r, c } = empty[Math.floor(Math.random() * empty.length)];
            const value = Math.random() < 0.9 ? 2 : 4;
            grid[r][c] = value;
        }

        function updateScore() {
            scoreDisplay.textContent = score;
            if (score > bestScore) {
                bestScore = score;
                updateBestDisplay();
                saveBestToVK();
                saveBestToLocal();
            }
        }

        function isGameOver() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 0) return false;
                    if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return false;
                    if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return false;
                }
            }
            return true;
        }

        // ----------------------------------------------------------------
        // 6. ДВИЖЕНИЕ (с анимацией)
        // ----------------------------------------------------------------
        function move(direction) {
            if (isMoving || gameOver) return;

            // Сохраняем состояние для отмены
            history.push(JSON.stringify(grid));

            let moved = false;
            const newGrid = grid.map(row => [...row]);
            const merged = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
            let mergeCount = 0;
            let maxMergedValue = 0;

            const rows = [...Array(SIZE).keys()];
            const cols = [...Array(SIZE).keys()];

            if (direction === 'down') rows.reverse();
            if (direction === 'right') cols.reverse();

            for (const r of rows) {
                for (const c of cols) {
                    const val = newGrid[r][c];
                    if (val === 0) continue;

                    let dr = 0, dc = 0;
                    if (direction === 'up') dr = -1;
                    else if (direction === 'down') dr = 1;
                    else if (direction === 'left') dc = -1;
                    else if (direction === 'right') dc = 1;

                    let nr = r, nc = c;
                    while (true) {
                        const nextR = nr + dr;
                        const nextC = nc + dc;
                        if (nextR < 0 || nextR >= SIZE || nextC < 0 || nextC >= SIZE) break;
                        if (newGrid[nextR][nextC] === 0) {
                            nr = nextR;
                            nc = nextC;
                            continue;
                        }
                        if (newGrid[nextR][nextC] === val && !merged[nextR][nextC]) {
                            nr = nextR;
                            nc = nextC;
                            merged[nr][nc] = true;
                            mergeCount++;
                            maxMergedValue = Math.max(maxMergedValue, val * 2);
                            break;
                        }
                        break;
                    }

                    if (nr !== r || nc !== c) {
                        moved = true;
                        if (merged[nr][nc]) {
                            newGrid[nr][nc] = val * 2;
                            score += val * 2;
                            // Звук слияния
                            soundMerge(val * 2);
                            // Эффект слияния
                            const el = createTileElement(val * 2, nr, nc, true, true);
                            boardEl.appendChild(el);
                            tiles.push(el);
                        } else {
                            newGrid[nr][nc] = val;
                        }
                        if (nr !== r || nc !== c) {
                            newGrid[r][c] = 0;
                        }
                    }
                }
            }

            if (!moved) {
                history.pop();
                return;
            }

            grid = newGrid;
            soundMove();

            // Обновляем счёт
            updateScore();

            // Проверка на победу (2048)
            let has2048 = false;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 2048) has2048 = true;
                }
            }
            if (has2048 && !won) {
                won = true;
                soundWin();
                celebrateNewNumber(2048);
            }

            // Салют за каждую 1000 очков
            const threshold = Math.floor(score / 1000);
            if (threshold > 0 && threshold % 1 === 0) {
                // Проверяем, был ли уже салют за этот порог
                if (!window._lastCelebratedThreshold || window._lastCelebratedThreshold < threshold) {
                    window._lastCelebratedThreshold = threshold;
                    celebrateScore(threshold * 1000);
                }
            }

            // Добавляем новую плитку
            addRandomTile();

            // Отрисовываем с анимацией
            renderGrid(true);

            // Проверка на конец игры
            if (isGameOver()) {
                gameOver = true;
                soundLose();
                setTimeout(() => {
                    showGameOver();
                }, 300);
            }

            // Проверка на новые большие числа (салют)
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = grid[r][c];
                    if (val >= 2048 && val % 2 === 0) {
                        // Салют для чисел 4096, 8192, 16384 и т.д.
                        const log = Math.log2(val);
                        if (Number.isInteger(log) && log > 11) {
                            celebrateNewNumber(val);
                        }
                    }
                }
            }
        }

        // ----------------------------------------------------------------
        // 7. ЭФФЕКТЫ: САЛЮТЫ, ЧАСТИЦЫ, СМЕНА ФОНА
        // ----------------------------------------------------------------
        function celebrateNewNumber(value) {
            // Салют над плиткой
            const boardRect = boardEl.getBoundingClientRect();
            const size = boardEl.clientWidth / SIZE;

            // Ищем позицию плитки с этим числом
            let pos = null;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === value) {
                        pos = { r, c };
                        break;
                    }
                }
                if (pos) break;
            }

            const cx = boardRect.left + (pos ? pos.c * size + size/2 : boardRect.width/2);
            const cy = boardRect.top + (pos ? pos.r * size + size/2 : boardRect.height/2);

            // Количество частиц зависит от числа
            const count = Math.min(30 + Math.floor(Math.log2(value) / 2) * 5, 80);
            createFireworks(cx, cy, count);

            // Звук празднования
            soundCelebration();

            // Смена цвета фона
            changeBackgroundColor(value);

            // Показываем сообщение
            showFloatingText(`🎉 ${value}!`, cx, cy);
        }

        function celebrateScore(scoreValue) {
            const boardRect = boardEl.getBoundingClientRect();
            const cx = boardRect.left + boardRect.width / 2;
            const cy = boardRect.top + boardRect.height / 2;

            const count = Math.min(20 + Math.floor(scoreValue / 1000) * 5, 50);
            createFireworks(cx, cy, count, '#ffd700');

            showFloatingText(`⭐ ${scoreValue} очков!`, cx, cy - 30);
            soundCelebration();
        }

        function createFireworks(cx, cy, count, color = null) {
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6fb7', '#a66bff', '#ff9f43'];
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle particle-burst';
                const size = 4 + Math.random() * 8;
                const angle = Math.random() * 2 * Math.PI;
                const distance = 80 + Math.random() * 200;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                particle.style.cssText = `
                    left: ${cx + (Math.random() - 0.5) * 10}px;
                    top: ${cy + (Math.random() - 0.5) * 10}px;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color || colors[Math.floor(Math.random() * colors.length)]};
                    box-shadow: 0 0 ${size * 2}px ${color || colors[Math.floor(Math.random() * colors.length)]};
                    --tx: ${tx}px;
                    --ty: ${ty}px;
                    animation-duration: ${0.6 + Math.random() * 0.4}s;
                `;
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1200);
            }
        }

        function changeBackgroundColor(value) {
            const colors = {
                2048: '#1a1a1a',  // золотой оттенок
                4096: '#0d1b3e',  // глубокий синий
                8192: '#3d0a0a',  // красный
                16384: '#2d0a3d'  // фиолетовый
            };
            const color = colors[value] || null;
            if (color) {
                document.body.style.background = color;
                // Плавный переход уже есть в CSS
            }
        }

        function showFloatingText(text, x, y) {
            const el = document.createElement('div');
            el.style.cssText = `
                position: fixed;
                left: ${x}px;
                top: ${y}px;
                transform: translate(-50%, -50%);
                color: #fff;
                font-size: 24px;
                font-weight: bold;
                text-shadow: 0 0 20px rgba(255,255,255,0.3);
                pointer-events: none;
                z-index: 99999;
                animation: floatUp 1.2s ease-out forwards;
                font-family: 'Segoe UI', monospace;
            `;
            el.textContent = text;
            document.body.appendChild(el);

            // Добавляем ключевые кадры для анимации
            const style = document.createElement('style');
            style.textContent = `
                @keyframes floatUp {
                    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
                    100% { opacity: 0; transform: translate(-50%, -120px) scale(1.2); }
                }
            `;
            document.head.appendChild(style);
            setTimeout(() => {
                el.remove();
                style.remove();
            }, 1300);
        }

        function showGameOver() {
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: absolute;
                inset: 0;
                background: rgba(0,0,0,0.6);
                border-radius: 16px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                backdrop-filter: blur(4px);
            `;
            overlay.innerHTML = `
                <div style="font-size: 32px; color: #fff; font-weight: bold; margin-bottom: 12px;">💀 Игра окончена</div>
                <div style="font-size: 18px; color: #c0d0e6; margin-bottom: 20px;">Счёт: ${score}</div>
                <button onclick="this.closest('div').remove(); newGame();" style="
                    background: #2ecc71;
                    border: none;
                    color: #0a0c12;
                    font-family: inherit;
                    font-size: 18px;
                    font-weight: bold;
                    padding: 12px 32px;
                    border-radius: 60px;
                    cursor: pointer;
                ">🔄 Попробовать снова</button>
            `;
            boardEl.appendChild(overlay);
        }

        // ----------------------------------------------------------------
        // 8. УПРАВЛЕНИЕ
        // ----------------------------------------------------------------
        function newGame() {
            // Убираем оверлей, если есть
            const overlay = boardEl.querySelector('div[style*="position: absolute"]');
            if (overlay) overlay.remove();

            history = [];
            initGrid();
            window._lastCelebratedThreshold = 0;
            // Возвращаем фон
            document.body.style.background = '#0a0c12';
        }

        function undoMove() {
            if (history.length === 0 || isMoving) return;
            const state = JSON.parse(history.pop());
            grid = state;
            renderGrid(true);
            score = 0;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = grid[r][c];
                    if (val !== 0) {
                        // Приблизительный подсчёт счёта (не точный, но для демо)
                    }
                }
            }
            updateScore();
            gameOver = false;
        }

        // ----------------------------------------------------------------
        // 9. ОБРАБОТЧИКИ СОБЫТИЙ (клавиатура, свайпы, кнопки)
        // ----------------------------------------------------------------
        let touchStartX = 0, touchStartY = 0;

        function setupControls() {
            // Клавиатура
            document.addEventListener('keydown', (e) => {
                const map = {
                    'ArrowUp': 'up', 'ArrowDown': 'down',
                    'ArrowLeft': 'left', 'ArrowRight': 'right'
                };
                const dir = map[e.key];
                if (dir) {
                    e.preventDefault();
                    move(dir);
                }
            });

            // Свайпы на поле
            boardEl.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                touchStartX = t.clientX;
                touchStartY = t.clientY;
            }, { passive: true });

            boardEl.addEventListener('touchend', (e) => {
                if (touchStartX === 0 && touchStartY === 0) return;
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
                if (Math.abs(dx) > Math.abs(dy)) {
                    move(dx > 0 ? 'right' : 'left');
                } else {
                    move(dy > 0 ? 'down' : 'up');
                }
                touchStartX = 0;
                touchStartY = 0;
            }, { passive: true });

            // Кнопки
            document.getElementById('newGameBtn').addEventListener('click', () => {
                newGame();
            });
            document.getElementById('undoBtn').addEventListener('click', () => {
                undoMove();
            });
        }

        // ----------------------------------------------------------------
        // 10. СТАРТ
        // ----------------------------------------------------------------
        function start() {
            initAudio();
            initVK();
            initGrid();
            setupControls();
            window._lastCelebratedThreshold = 0;
        }

        // Переопределяем для кнопки "Попробовать снова" внутри оверлея
        window.newGame = newGame;

        // Запускаем, когда DOM готов
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }
    })();
</script>
</body>
</html>
