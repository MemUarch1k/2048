<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memuar's 2048</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Courier New', monospace;
            touch-action: none;
            transition: background 0.8s ease;
        }

        /* ---- СВЕТЛАЯ ТЕМА ---- */
        body.light {
            background: #f0f0f0;
        }
        body.light .game-wrapper {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        body.light .game-panel { background: #f7f7f7; }
        body.light .title { color: #333; }
        body.light .title span { color: #2ecc71; }
        body.light .score-box { background: #ffffff; }
        body.light .score-box .label { color: #888; }
        body.light .score-box .value { color: #333; }
        body.light .score-box.best .value { color: #f39c12; }
        body.light .board-wrapper { background: #ffffff; }
        body.light .board { background: #e8e8e8; }
        body.light button {
            background: #e0e0e0;
            color: #333;
            box-shadow: 0 3px 0 #c0c0c0;
        }
        body.light .btn-primary {
            background: #2ecc71;
            color: #fff;
            box-shadow: 0 3px 0 #1e8a4c;
        }
        body.light .size-btn {
            background: #e0e0e0;
            color: #333;
        }
        body.light .size-btn.active {
            background: #2ecc71;
            color: #fff;
        }
        body.light .combo-display {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }

        /* ---- ТЁМНАЯ ТЕМА (СВЕТЛЕЕ И ЯРЧЕ) ---- */
        body.dark {
            background: #1a1e2e;
        }
        body.dark .game-wrapper {
            background: #222838;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        body.dark .game-panel { background: #1a1e2e; }
        body.dark .title { color: #d0d8e8; }
        body.dark .title span { color: #4dd0a0; }
        body.dark .score-box { background: #2a3040; }
        body.dark .score-box .label { color: #8a9aaa; }
        body.dark .score-box .value { color: #4dd0a0; }
        body.dark .score-box.best .value { color: #f5b342; }
        body.dark .board-wrapper { background: #2a3040; }
        body.dark .board { background: #1e2434; }
        body.dark button {
            background: #2a3040;
            color: #d0d8e8;
            box-shadow: 0 3px 0 #161a28;
        }
        body.dark .btn-primary {
            background: #4dd0a0;
            color: #0a0c12;
            box-shadow: 0 3px 0 #2e8a6a;
        }
        body.dark .size-btn {
            background: #2a3040;
            color: #d0d8e8;
        }
        body.dark .size-btn.active {
            background: #4dd0a0;
            color: #0a0c12;
        }
        body.dark .combo-display {
            background: rgba(42, 48, 64, 0.9);
            color: #4dd0a0;
            box-shadow: 0 2px 12px rgba(77, 208, 160, 0.25);
            border: 1px solid #4dd0a0;
        }

        /* ---- НОВЫЕ ЦВЕТА ПЛИТОК (ТЁМНАЯ ТЕМА — СВЕТЛЕЕ) ---- */
        body.dark .tile-2    { background: #d4c9b8; color: #3d3d3d; }
        body.dark .tile-4    { background: #e8d4b0; color: #3d3d3d; }
        body.dark .tile-8    { background: #f5b27a; color: #fff; }
        body.dark .tile-16   { background: #f59563; color: #fff; }
        body.dark .tile-32   { background: #f57c5f; color: #fff; }
        body.dark .tile-64   { background: #e85a3a; color: #fff; }
        body.dark .tile-128  { background: #edcf72; color: #fff; }
        body.dark .tile-256  { background: #edc850; color: #fff; }
        body.dark .tile-512  { background: #edc22e; color: #fff; }
        body.dark .tile-1024 { background: #f5b342; color: #fff; }
        body.dark .tile-2048 { background: #f5a623; color: #fff; box-shadow: 0 0 30px rgba(245, 166, 35, 0.5); }
        body.dark .tile-super { background: #5a6a7a; color: #fff; }

        /* ---- СВЕТЛАЯ ТЕМА (оставляем классику) ---- */
        body.light .tile-2    { background: #eee4da; color: #776e65; }
        body.light .tile-4    { background: #ede0c8; color: #776e65; }
        body.light .tile-8    { background: #f2b179; color: #f9f6f2; }
        body.light .tile-16   { background: #f59563; color: #f9f6f2; }
        body.light .tile-32   { background: #f67c5f; color: #f9f6f2; }
        body.light .tile-64   { background: #f65e3b; color: #f9f6f2; }
        body.light .tile-128  { background: #edcf72; color: #f9f6f2; }
        body.light .tile-256  { background: #edcc61; color: #f9f6f2; }
        body.light .tile-512  { background: #edc850; color: #f9f6f2; }
        body.light .tile-1024 { background: #edc53f; color: #f9f6f2; }
        body.light .tile-2048 { background: #edc22e; color: #f9f6f2; }
        body.light .tile-super { background: #3c3a32; color: #f9f6f2; }

        /* ---- ОСНОВНЫЕ СТИЛИ ---- */
        .game-wrapper {
            border-radius: 48px;
            padding: 20px;
            max-width: 520px;
            width: 100%;
            margin: 12px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .game-panel {
            border-radius: 32px;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }
        .title small { font-size: 12px; opacity: 0.6; }

        .scores {
            display: flex;
            gap: 10px;
        }

        .score-box {
            border-radius: 16px;
            padding: 4px 14px;
            text-align: center;
            min-width: 60px;
            transition: background 0.3s ease;
        }
        .score-box .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-box .value {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.2;
            transition: color 0.3s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .size-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .size-btn {
            border: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }
        .size-btn:active { transform: translateY(2px); }

        .board-wrapper {
            position: relative;
            border-radius: 24px;
            padding: 10px;
            margin-bottom: 16px;
            touch-action: none;
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        .board {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            touch-action: none;
            transition: background 0.4s ease;
        }

        .tile {
            position: absolute;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: left 0.1s ease, top 0.1s ease;
            will-change: transform, left, top;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
            z-index: 10;
        }

        @keyframes tileAppear {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .tile-appear { animation: tileAppear 0.2s ease-out forwards; }

        @keyframes tileMerge {
            0% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .tile-merge { animation: tileMerge 0.2s ease-out forwards; }

        .combo-display {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 16px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 40px;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 50;
            font-family: 'Segoe UI', monospace;
            transform: scale(0.9);
            backdrop-filter: blur(4px);
            border: 1px solid transparent;
        }
        .combo-display.show {
            opacity: 1;
            transform: scale(1);
        }
        @keyframes comboPulseSmall {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .combo-display.pulse {
            animation: comboPulseSmall 0.3s ease-out;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 9999;
        }
        @keyframes burst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        .particle-burst { animation: burst 0.7s ease-out forwards; }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            border: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
            flex: 1;
            min-width: 80px;
        }
        button:active { transform: translateY(2px); }

        .theme-toggle {
            background: #2c3e50;
            color: #fff;
            flex: 0.4;
            min-width: 50px;
            font-size: 20px;
            padding: 10px 16px;
        }
        body.light .theme-toggle {
            background: #ddd;
            color: #333;
        }

        @media (max-width: 500px) {
            .game-wrapper { padding: 12px; border-radius: 32px; }
            .game-panel { padding: 12px; }
            .title { font-size: 18px; }
            .score-box .value { font-size: 18px; }
            .score-box { padding: 4px 10px; min-width: 50px; }
            button { font-size: 13px; padding: 8px 14px; min-width: 60px; }
            .size-btn { font-size: 11px; padding: 4px 12px; }
            .combo-display { font-size: 14px; padding: 3px 10px; top: 8px; left: 8px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-panel">
        <div class="header">
            <div class="title">MEMUAR<span>'S</span> <small>2048</small></div>
            <div class="scores">
                <div class="score-box"><div class="label">Счёт</div><div class="value" id="scoreDisplay">0</div></div>
                <div class="score-box best"><div class="label">Рекорд</div><div class="value" id="bestDisplay">0</div></div>
            </div>
        </div>
        <div class="size-selector">
            <button class="size-btn" data-size="4">4×4</button>
            <button class="size-btn" data-size="5">5×5</button>
            <button class="size-btn" data-size="6">6×6</button>
            <button class="size-btn" data-size="7">7×7</button>
            <button class="size-btn" data-size="8">8×8</button>
        </div>
        <div class="board-wrapper" id="boardWrapper">
            <div class="board" id="board"></div>
            <div class="combo-display" id="comboDisplay"></div>
        </div>
        <div class="controls">
            <button id="newGameBtn" class="btn-primary">🔄 Новая игра</button>
            <button id="themeBtn" class="theme-toggle">🌙</button>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        let SIZE = 4;
        let grid = [];
        let score = 0;
        let bestScore = 0;
        let gameOver = false;
        let won = false;
        let isMoving = false;
        let tiles = [];
        let tileId = 0;
        let isDark = false;
        let mergeCount = 0;
        let combo = 0;
        let emptyMoves = 0;

        const boardEl = document.getElementById('board');
        const boardWrapper = document.getElementById('boardWrapper');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const bestDisplay = document.getElementById('bestDisplay');
        const themeBtn = document.getElementById('themeBtn');
        const comboDisplay = document.getElementById('comboDisplay');

        // ---- ЗВУКИ ----
        let audioCtx = null;
        function initAudio() {
            if (audioCtx) return;
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }

        function playTone(freq, duration, volume = 0.12, type = 'sine') {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function soundMove() { playTone(300, 0.05, 0.07); }
        function soundMerge(val) { playTone(400 + Math.log2(val) * 30, 0.12, 0.1); }
        function soundCombo(c) {
            const base = 440 + Math.min(c, 10) * 20;
            playTone(base * 0.8, 0.08, 0.08);
            setTimeout(() => playTone(base, 0.08, 0.1), 70);
            setTimeout(() => playTone(base * 1.25, 0.12, 0.12), 140);
        }
        function soundWin() {
            playTone(523, 0.15, 0.12);
            setTimeout(() => playTone(659, 0.15, 0.12), 120);
            setTimeout(() => playTone(784, 0.25, 0.15), 240);
        }
        function soundLose() { playTone(300, 0.3, 0.12, 'sawtooth'); }
        function soundCelebration() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => playTone(400 + i * 70, 0.08, 0.06), i * 70);
            }
        }

        function loadBest() {
            try {
                const saved = localStorage.getItem('memuars_2048_best');
                if (saved) {
                    bestScore = parseInt(saved, 10) || 0;
                }
            } catch(e) {}
            bestDisplay.textContent = bestScore;
        }

        function saveBest() {
            try {
                localStorage.setItem('memuars_2048_best', String(bestScore));
            } catch(e) {}
        }

        function initGrid() {
            grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
            tiles = [];
            tileId = 0;
            gameOver = false;
            won = false;
            score = 0;
            mergeCount = 0;
            combo = 0;
            emptyMoves = 0;
            scoreDisplay.textContent = '0';
            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 0) empty.push({ r, c });
                }
            }
            if (empty.length === 0) return;
            const { r, c } = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        }

        function updateScore() {
            scoreDisplay.textContent = Math.floor(score);
            if (score > bestScore) {
                bestScore = score;
                bestDisplay.textContent = bestScore;
                saveBest();
            }
        }

        function isGameOver() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 0) return false;
                    if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return false;
                    if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return false;
                }
            }
            return true;
        }

        function render() {
            const size = boardEl.clientWidth / SIZE;
            boardEl.innerHTML = '';

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell-bg';
                    cell.style.cssText = `
                        position: absolute;
                        left: ${c * size + 4}px;
                        top: ${r * size + 4}px;
                        width: ${size - 8}px;
                        height: ${size - 8}px;
                        background: rgba(255,255,255,0.06);
                        border-radius: 8px;
                    `;
                    boardEl.appendChild(cell);
                }
            }

            tiles = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = grid[r][c];
                    if (val === 0) continue;
                    const el = document.createElement('div');
                    el.className = 'tile';
                    el.dataset.row = r;
                    el.dataset.col = c;
                    el.dataset.value = val;
                    el.dataset.id = tileId++;
                    el.style.width = size - 8 + 'px';
                    el.style.height = size - 8 + 'px';
                    el.style.left = (c * size + 4) + 'px';
                    el.style.top = (r * size + 4) + 'px';
                    el.style.background = getTileBackground(val);
                    el.style.color = val <= 4 ? '#3d3d3d' : '#fff';
                    if (val >= 2048) {
                        el.style.boxShadow = '0 0 30px rgba(245, 166, 35, 0.5)';
                    }
                    el.style.fontSize = val < 100 ? '1.2em' : val < 1000 ? '1em' : val < 10000 ? '0.85em' : '0.7em';
                    el.textContent = val;
                    boardEl.appendChild(el);
                    tiles.push(el);
                }
            }
        }

        function getTileBackground(val) {
            const map = {
                2: '#d4c9b8', 4: '#e8d4b0', 8: '#f5b27a',
                16: '#f59563', 32: '#f57c5f', 64: '#e85a3a',
                128: '#edcf72', 256: '#edc850', 512: '#edc22e',
                1024: '#f5b342', 2048: '#f5a623'
            };
            return map[val] || '#5a6a7a';
        }

        function createFirework(cx, cy, count, color = null) {
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6fb7', '#a66bff', '#ff9f43'];
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle particle-burst';
                const size = 3 + Math.random() * 6;
                const angle = Math.random() * 2 * Math.PI;
                const dist = 30 + Math.random() * 80;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;
                const c = color || colors[Math.floor(Math.random() * colors.length)];
                p.style.cssText = `
                    left: ${cx + (Math.random() - 0.5) * 10}px;
                    top: ${cy + (Math.random() - 0.5) * 10}px;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${c};
                    box-shadow: 0 0 ${size * 2}px ${c};
                    --tx: ${tx}px;
                    --ty: ${ty}px;
                    animation-duration: ${0.4 + Math.random() * 0.3}s;
                `;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        let comboTimeout = null;

        function showCombo(count) {
            if (count <= 1) {
                comboDisplay.classList.remove('show', 'pulse');
                return;
            }
            comboDisplay.textContent = `🔥 x${count}`;
            comboDisplay.classList.add('show');
            comboDisplay.classList.remove('pulse');
            void comboDisplay.offsetWidth;
            comboDisplay.classList.add('pulse');
            
            clearTimeout(comboTimeout);
            comboTimeout = setTimeout(() => {
                comboDisplay.classList.remove('show', 'pulse');
            }, 800);
        }

        function showFloatingText(text, x, y) {
            const el = document.createElement('div');
            el.style.cssText = `
                position: fixed;
                left: ${x}px;
                top: ${y}px;
                transform: translate(-50%, -50%);
                color: #fff;
                font-size: 22px;
                font-weight: bold;
                text-shadow: 0 0 20px rgba(0,0,0,0.5);
                pointer-events: none;
                z-index: 99999;
                animation: floatUp 1s ease-out forwards;
                font-family: 'Segoe UI', monospace;
            `;
            el.textContent = text;
            document.body.appendChild(el);
            const style = document.createElement('style');
            style.textContent = `
                @keyframes floatUp {
                    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
                    100% { opacity: 0; transform: translate(-50%, -120px) scale(1.2); }
                }
            `;
            document.head.appendChild(style);
            setTimeout(() => { el.remove(); style.remove(); }, 1100);
        }

        function changeBackgroundByNumber(value) {
            const colors = {
                2048: '#2a2a3a',
                4096: '#1a2a4a',
                8192: '#4a1a2a',
                16384: '#3a1a4a',
                32768: '#1a3a3a'
            };
            const color = colors[value] || null;
            if (color) {
                document.body.style.background = color;
                boardWrapper.style.background = color;
                boardWrapper.style.boxShadow = `0 0 40px ${color}80`;
            }
        }

        function changeBackgroundByMerge() {
            const colors = ['#1a2a2a', '#2a1a2a', '#2a2a1a', '#1a2a3a'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.background = color;
            boardWrapper.style.background = color;
            boardWrapper.style.boxShadow = `0 0 40px ${color}80`;
            showFloatingText('✨ +20 слияний!', window.innerWidth / 2, 80);
        }

        function celebrateNewNumber(value) {
            const rect = boardEl.getBoundingClientRect();
            const size = boardEl.clientWidth / SIZE;
            let cx = rect.left + rect.width / 2;
            let cy = rect.top + rect.height / 2;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === value) {
                        cx = rect.left + c * size + size / 2;
                        cy = rect.top + r * size + size / 2;
                        break;
                    }
                }
            }
            const count = Math.min(30 + Math.floor(Math.log2(value) / 2) * 4, 70);
            createFirework(cx, cy, count);
            soundCelebration();
            showFloatingText(`🎉 ${value}!`, cx, cy);
        }

        function celebrateScore(val) {
            const rect = boardEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const count = Math.min(20 + Math.floor(val / 1000) * 4, 50);
            createFirework(cx, cy, count, '#ffd93d');
            showFloatingText(`⭐ ${val} очков!`, cx, cy - 30);
            soundCelebration();
        }

        function showGameOver() {
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: absolute;
                inset: 0;
                background: rgba(0,0,0,0.5);
                border-radius: 16px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                backdrop-filter: blur(4px);
            `;
            overlay.innerHTML = `
                <div style="font-size: 28px; color: #fff; font-weight: bold; margin-bottom: 8px;">💀 Игра окончена</div>
                <div style="font-size: 16px; color: #ccc; margin-bottom: 16px;">Счёт: ${Math.floor(score)}</div>
                <button onclick="this.closest('div').remove(); window._newGame();" style="
                    background: #4dd0a0;
                    border: none;
                    color: #0a0c12;
                    font-family: inherit;
                    font-size: 16px;
                    font-weight: bold;
                    padding: 10px 28px;
                    border-radius: 60px;
                    cursor: pointer;
                ">🔄 Играть снова</button>
            `;
            boardEl.appendChild(overlay);
        }

        function move(direction) {
            if (isMoving || gameOver) return;

            let moved = false;
            const newGrid = grid.map(row => [...row]);
            const merged = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
            let mergeCountThisMove = 0;
            let mergedPositions = [];

            const rows = [...Array(SIZE).keys()];
            const cols = [...Array(SIZE).keys()];
            if (direction === 'down') rows.reverse();
            if (direction === 'right') cols.reverse();

            for (const r of rows) {
                for (const c of cols) {
                    const val = newGrid[r][c];
                    if (val === 0) continue;

                    let dr = 0, dc = 0;
                    if (direction === 'up') dr = -1;
                    else if (direction === 'down') dr = 1;
                    else if (direction === 'left') dc = -1;
                    else if (direction === 'right') dc = 1;

                    let nr = r, nc = c;
                    while (true) {
                        const nextR = nr + dr;
                        const nextC = nc + dc;
                        if (nextR < 0 || nextR >= SIZE || nextC < 0 || nextC >= SIZE) break;
                        if (newGrid[nextR][nextC] === 0) {
                            nr = nextR;
                            nc = nextC;
                            continue;
                        }
                        if (newGrid[nextR][nextC] === val && !merged[nextR][nextC]) {
                            nr = nextR;
                            nc = nextC;
                            merged[nr][nc] = true;
                            mergeCountThisMove++;
                            mergedPositions.push({ r: nr, c: nc, value: val * 2 });
                            break;
                        }
                        break;
                    }

                    if (nr !== r || nc !== c) {
                        moved = true;
                        if (merged[nr][nc]) {
                            newGrid[nr][nc] = val * 2;
                            score += val * 2;
                            soundMerge(val * 2);
                        } else {
                            newGrid[nr][nc] = val;
                        }
                        newGrid[r][c] = 0;
                    }
                }
            }

            if (!moved) {
                emptyMoves++;
                if (emptyMoves >= 2) {
                    combo = 0;
                    emptyMoves = 0;
                    showCombo(combo);
                }
                return;
            }

            emptyMoves = 0;

            combo += mergeCountThisMove;
            const bonus = Math.min(combo * 0.1, 20);
            score += bonus;

            showCombo(combo);
            if (combo > 1) soundCombo(combo);

            grid = newGrid;
            soundMove();
            updateScore();

            for (const pos of mergedPositions) {
                const rect = boardEl.getBoundingClientRect();
                const size = boardEl.clientWidth / SIZE;
                const cx = rect.left + pos.c * size + size / 2;
                const cy = rect.top + pos.r * size + size / 2;
                createFirework(cx, cy, 12, '#ff6b6b');
            }

            mergeCount += mergeCountThisMove;
            if (mergeCount >= 20) {
                mergeCount = 0;
                changeBackgroundByMerge();
            }

            let has2048 = false;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 2048) has2048 = true;
                }
            }
            if (has2048 && !won) {
                won = true;
                soundWin();
                celebrateNewNumber(2048);
                changeBackgroundByNumber(2048);
            }

            const threshold = Math.floor(score / 1000);
            if (threshold > 0 && (!window._lastThreshold || window._lastThreshold < threshold)) {
                window._lastThreshold = threshold;
                celebrateScore(threshold * 1000);
            }

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = grid[r][c];
                    if (val >= 4096 && val % 2 === 0) {
                        const log = Math.log2(val);
                        if (Number.isInteger(log) && log > 12) {
                            celebrateNewNumber(val);
                            changeBackgroundByNumber(val);
                        }
                    }
                }
            }

            addRandomTile();
            render();

            if (isGameOver()) {
                gameOver = true;
                soundLose();
                setTimeout(showGameOver, 300);
            }
        }

        function newGame() {
            const overlay = boardEl.querySelector('div[style*="position: absolute"]');
            if (overlay) overlay.remove();
            window._lastThreshold = 0;
            mergeCount = 0;
            combo = 0;
            emptyMoves = 0;
            const defaultBg = isDark ? '#1a1e2e' : '#f0f0f0';
            document.body.style.background = defaultBg;
            boardWrapper.style.background = isDark ? '#2a3040' : '#ffffff';
            boardWrapper.style.boxShadow = 'none';
            initGrid();
        }

        function setSize(size) {
            if (size === SIZE) return;
            SIZE = size;
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.size) === size);
            });
            newGame();
        }

        function toggleTheme() {
            isDark = !isDark;
            document.body.className = isDark ? 'dark' : 'light';
            themeBtn.textContent = isDark ? '☀️' : '🌙';
            const bg = isDark ? '#2a3040' : '#ffffff';
            boardWrapper.style.background = bg;
            boardWrapper.style.boxShadow = 'none';
        }

        let touchStartX = 0, touchStartY = 0;

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                const map = {
                    'ArrowUp': 'up', 'ArrowDown': 'down',
                    'ArrowLeft': 'left', 'ArrowRight': 'right'
                };
                const dir = map[e.key];
                if (dir) {
                    e.preventDefault();
                    move(dir);
                }
            });

            boardEl.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                touchStartX = t.clientX;
                touchStartY = t.clientY;
            }, { passive: true });

            boardEl.addEventListener('touchend', (e) => {
                if (touchStartX === 0) return;
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
                if (Math.abs(dx) > Math.abs(dy)) {
                    move(dx > 0 ? 'right' : 'left');
                } else {
                    move(dy > 0 ? 'down' : 'up');
                }
                touchStartX = 0;
                touchStartY = 0;
            }, { passive: true });

            document.getElementById('newGameBtn').addEventListener('click', newGame);
            themeBtn.addEventListener('click', toggleTheme);

            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setSize(parseInt(btn.dataset.size));
                });
            });
            document.querySelector('.size-btn[data-size="4"]').classList.add('active');
        }

        window._newGame = newGame;

        function start() {
            initAudio();
            loadBest();
            setupControls();
            initGrid();
            document.body.className = 'dark';
            themeBtn.textContent = '☀️';
            boardWrapper.style.background = '#2a3040';
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }
    })();
</script>
</body>
</html>
