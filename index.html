<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memuar's 2048</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Courier New', monospace;
            touch-action: none;
            transition: background 0.8s ease;
        }
        body.light {
            background: #f0f0f0;
        }
        body.light .game-wrapper {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        body.light .game-panel {
            background: #f7f7f7;
        }
        body.light .title {
            color: #333;
        }
        body.light .title span {
            color: #2ecc71;
        }
        body.light .score-box {
            background: #ffffff;
        }
        body.light .score-box .label {
            color: #888;
        }
        body.light .score-box .value {
            color: #333;
        }
        body.light .score-box.best .value {
            color: #f39c12;
        }
        body.light .board-wrapper {
            background: #ffffff;
        }
        body.light .board {
            background: #e0e0e0;
        }
        body.light button {
            background: #e0e0e0;
            color: #333;
            box-shadow: 0 3px 0 #c0c0c0;
        }
        body.light .btn-primary {
            background: #2ecc71;
            color: #fff;
            box-shadow: 0 3px 0 #1e8a4c;
        }
        body.light .size-btn {
            background: #e0e0e0;
            color: #333;
        }
        body.light .size-btn.active {
            background: #2ecc71;
            color: #fff;
        }
        body.light .combo-display {
            background: #fff;
            color: #333;
            box-shadow: 0 2px 20px rgba(0,0,0,0.15);
        }
        body.dark {
            background: #0a0c12;
        }
        body.dark .game-wrapper {
            background: #0f1117;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        body.dark .game-panel {
            background: #07090e;
        }
        body.dark .title {
            color: #c0d0e6;
        }
        body.dark .title span {
            color: #2ecc71;
        }
        body.dark .score-box {
            background: #0f1117;
        }
        body.dark .score-box .label {
            color: #5a6e8a;
        }
        body.dark .score-box .value {
            color: #2ecc71;
        }
        body.dark .score-box.best .value {
            color: #f39c12;
        }
        body.dark .board-wrapper {
            background: #0f1117;
        }
        body.dark .board {
            background: #0a0c12;
        }
        body.dark button {
            background: #1a1f2a;
            color: #c0d0e6;
            box-shadow: 0 3px 0 #0b0e12;
        }
        body.dark .btn-primary {
            background: #2ecc71;
            color: #0a0c12;
            box-shadow: 0 3px 0 #1e8a4c;
        }
        body.dark .size-btn {
            background: #1a1f2a;
            color: #c0d0e6;
        }
        body.dark .size-btn.active {
            background: #2ecc71;
            color: #0a0c12;
        }
        body.dark .combo-display {
            background: #1a1f2a;
            color: #2ecc71;
            box-shadow: 0 2px 20px rgba(46,204,113,0.2);
        }
        .light .tile-2    { background: #eee4da; color: #776e65; }
        .light .tile-4    { background: #ede0c8; color: #776e65; }
        .light .tile-8    { background: #f2b179; color: #f9f6f2; }
        .light .tile-16   { background: #f59563; color: #f9f6f2; }
        .light .tile-32   { background: #f67c5f; color: #f9f6f2; }
        .light .tile-64   { background: #f65e3b; color: #f9f6f2; }
        .light .tile-128  { background: #edcf72; color: #f9f6f2; }
        .light .tile-256  { background: #edcc61; color: #f9f6f2; }
        .light .tile-512  { background: #edc850; color: #f9f6f2; }
        .light .tile-1024 { background: #edc53f; color: #f9f6f2; }
        .light .tile-2048 { background: #edc22e; color: #f9f6f2; }
        .light .tile-super { background: #3c3a32; color: #f9f6f2; }
        .dark .tile-2    { background: #2a2a2a; color: #e0e0e0; }
        .dark .tile-4    { background: #3a3a3a; color: #e0e0e0; }
        .dark .tile-8    { background: #4a3a2a; color: #f9f6f2; }
        .dark .tile-16   { background: #5a3a2a; color: #f9f6f2; }
        .dark .tile-32   { background: #6a3a2a; color: #f9f6f2; }
        .dark .tile-64   { background: #7a2a1a; color: #f9f6f2; }
        .dark .tile-128  { background: #6a5a2a; color: #f9f6f2; }
        .dark .tile-256  { background: #7a6a2a; color: #f9f6f2; }
        .dark .tile-512  { background: #8a7a2a; color: #f9f6f2; }
        .dark .tile-1024 { background: #9a8a2a; color: #f9f6f2; }
        .dark .tile-2048 { background: #aa9a2a; color: #f9f6f2; }
        .dark .tile-super { background: #555; color: #f9f6f2; }
        .game-wrapper {
            border-radius: 48px;
            padding: 20px;
            max-width: 520px;
            width: 100%;
            margin: 12px;
            transition: background 0.3s ease;
        }
        .game-panel {
            border-radius: 32px;
            padding: 20px;
            transition: background 0.3s ease;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }
        .title small {
            font-size: 12px;
            opacity: 0.6;
        }
        .scores {
            display: flex;
            gap: 10px;
        }
        .score-box {
            border-radius: 16px;
            padding: 4px 14px;
            text-align: center;
            min-width: 60px;
            transition: background 0.3s ease;
        }
        .score-box .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-box .value {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.2;
            transition: color 0.3s ease;
        }
        .size-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .size-btn {
            border: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }
        .size-btn:active {
            transform: translateY(2px);
        }
        .board-wrapper {
            position: relative;
            border-radius: 24px;
            padding: 10px;
            margin-bottom: 16px;
            touch-action: none;
            transition: background 0.3s ease;
        }
        .board {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            touch-action: none;
            transition: background 0.3s ease;
        }
        .tile {
            position: absolute;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: left 0.12s ease, top 0.12s ease;
            will-change: transform, left, top;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
            z-index: 10;
        }
        @keyframes tileAppear {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .tile-appear {
            animation: tileAppear 0.2s ease-out forwards;
        }
        @keyframes tileMerge {
            0% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .tile-merge {
            animation: tileMerge 0.2s ease-out forwards;
        }
        .combo-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            pointer-events: none;
            z-index: 99999;
            padding: 16px 32px;
            border-radius: 60px;
            opacity: 0;
            transition: opacity 0.1s ease;
            font-family: 'Segoe UI', monospace;
        }
        .combo-display.show {
            opacity: 1;
            animation: comboPulse 0.6s ease-out forwards;
        }
        @keyframes comboPulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 9999;
        }
        @keyframes burst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        .particle-burst {
            animation: burst 0.7s ease-out forwards;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            border: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
            flex: 1;
            min-width: 80px;
        }
        button:active {
            transform: translateY(2px);
        }
        .theme-toggle {
            background: #2c3e50;
            color: #fff;
            flex: 0.4;
            min-width: 50px;
            font-size: 20px;
            padding: 10px 16px;
        }
        body.light .theme-toggle {
            background: #ddd;
            color: #333;
        }
        @media (max-width: 500px) {
            .game-wrapper { padding: 12px; border-radius: 32px; }
            .game-panel { padding: 12px; }
            .title { font-size: 18px; }
            .score-box .value { font-size: 18px; }
            .score-box { padding: 4px 10px; min-width: 50px; }
            button { font-size: 13px; padding: 8px 14px; min-width: 60px; }
            .size-btn { font-size: 11px; padding: 4px 12px; }
            .combo-display { font-size: 32px; padding: 12px 24px; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="game-panel">
        <div class="header">
            <div class="title">MEMUAR<span>'S</span> <small>2048</small></div>
            <div class="scores">
                <div class="score-box">
                    <div class="label">Счёт</div>
                    <div class="value" id="scoreDisplay">0</div>
                </div>
                <div class="score-box best">
                    <div class="label">Рекорд</div>
                    <div class="value" id="bestDisplay">0</div>
                </div>
            </div>
        </div>
        <div class="size-selector">
            <button class="size-btn" data-size="4">4×4</button>
            <button class="size-btn" data-size="5">5×5</button>
            <button class="size-btn" data-size="6">6×6</button>
            <button class="size-btn" data-size="7">7×7</button>
            <button class="size-btn" data-size="8">8×8</button>
        </div>
        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>
        <div class="controls">
            <button id="newGameBtn" class="btn-primary">🔄 Новая игра</button>
            <button id="themeBtn" class="theme-toggle">🌙</button>
        </div>
    </div>
</div>
<div class="combo-display" id="comboDisplay"></div>

<script>
    (function() {
        'use strict';

        let SIZE = 4;
        let grid = [];
        let score = 0;
        let bestScore = 0;
        let gameOver = false;
        let won = false;
        let isMoving = false;
        let tiles = [];
        let tileId = 0;
        let isDark = false;
        let mergeCount = 0;
        let combo = 0;
        let emptyMoves = 0;

        const boardEl = document.getElementById('board');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const bestDisplay = document.getElementById('bestDisplay');
        const themeBtn = document.getElementById('themeBtn');
        const comboDisplay = document.getElementById('comboDisplay');

        let audioCtx = null;
        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {}
        }

        function playTone(freq, duration, volume = 0.12, type = 'sine') {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function soundMove() { playTone(300, 0.05, 0.07); }
        function soundMerge(val) { playTone(400 + Math.log2(val) * 30, 0.12, 0.1); }
        function soundCombo(c) {
            const base = 440 + Math.min(c, 10) * 20;
            playTone(base * 0.8, 0.08, 0.08);
            setTimeout(() => playTone(base, 0.08, 0.1), 70);
            setTimeout(() => playTone(base * 1.25, 0.12, 0.12), 140);
        }
        function soundWin() {
            playTone(523, 0.15, 0.12);
            setTimeout(() => playTone(659, 0.15, 0.12), 120);
            setTimeout(() => playTone(784, 0.25, 0.15), 240);
        }
        function soundLose() { playTone(300, 0.3, 0.12, 'sawtooth'); }
        function soundCelebration() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => playTone(400 + i * 70, 0.08, 0.06), i * 70);
            }
        }

        function loadBest() {
            try {
                const saved = localStorage.getItem('memuars_2048_best');
                if (saved) {
                    bestScore = parseInt(saved, 10) || 0;
                }
            } catch(e) {}
            bestDisplay.textContent = bestScore;
        }

        function saveBest() {
            try {
                localStorage.setItem('memuars_2048_best', String(bestScore));
            } catch(e) {}
        }

        function initGrid() {
            grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
            tiles = [];
            tileId = 0;
            gameOver = false;
            won = false;
            score = 0;
            mergeCount = 0;
            combo = 0;
            emptyMoves = 0;
            scoreDisplay.textContent = '0';
            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 0) empty.push({ r, c });
                }
            }
            if (empty.length === 0) return;
            const { r, c } = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        }

        function updateScore() {
            scoreDisplay.textContent = Math.floor(score);
            if (score > bestScore) {
                bestScore = score;
                bestDisplay.textContent = bestScore;
                saveBest();
            }
        }

        function isGameOver() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 0) return false;
                    if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return false;
                    if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return false;
                }
            }
            return true;
        }

        function render() {
            const size = boardEl.clientWidth / SIZE;
            boardEl.querySelectorAll('.tile').forEach(el => el.remove());
            boardEl.querySelectorAll('.cell-bg').forEach(el => el.remove());

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell-bg';
                    cell.style.cssText = `
                        position: absolute;
                        left: ${c * size + 4}px;
                        top: ${r * size + 4}px;
                        width: ${size - 8}px;
                        height: ${size - 8}px;
                        background: rgba(255,255,255,0.06);
                        border-radius: 8px;
                    `;
                    boardEl.appendChild(cell);
                }
            }

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = grid[r][c];
                    if (val === 0) continue;
                    const el = document.createElement('div');
                    el.className = 'tile';
                    el.dataset.row = r;
                    el.dataset.col = c;
                    el.dataset.value = val;
                    el.dataset.id = tileId++;
                    el.style.width = size - 8 + 'px';
                    el.style.height = size - 8 + 'px';
                    el.style.left = c * size + 4 + 'px';
                    el.style.top = r * size + 4 + 'px';
                    el.style.fontSize = val < 100 ? '1.2em' : val < 1000 ? '1em' : val < 10000 ? '0.85em' : '0.7em';
                    el.style.background = getTileBackground(val);
                    el.style.color = val <= 4 ? '#776e65' : '#f9f6f2';
                    if (val >= 2048) {
                        el.style.boxShadow = '0 0 30px rgba(237, 194, 46, 0.4)';
                    }
                    el.textContent = val;
                    boardEl.appendChild(el);
                    tiles.push(el);
                }
            }
        }

        function getTileBackground(val) {
            const map = {
                2: '#eee4da', 4: '#ede0c8', 8: '#f2b179',
                16: '#f59563', 32: '#f67c5f', 64: '#f65e3b',
                128: '#edcf72', 256: '#edcc61', 512: '#edc850',
                1024: '#edc53f', 2048: '#edc22e'
            };
            return map[val] || '#3c3a32';
        }

        function createFirework(cx, cy, count, color = null) {
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6fb7', '#a66bff', '#ff9f43'];
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle particle-burst';
                const size = 3 + Math.random() * 6;
                const angle = Math.random() * 2 * Math.PI;
                const dist = 30 + Math.random() * 80;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;
                const c = color || colors[Math.floor(Math.random() * colors.length)];
                p.style.cssText = `
                    left: ${cx + (Math.random() - 0.5) * 10}px;
                    top: ${cy + (Math.random() - 0.5) * 10}px;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${c};
                    box-shadow: 0 0 ${size * 2}px ${c};
                    --tx: ${tx}px;
                    --ty: ${ty}px;
                    animation-duration: ${0.4 + Math.random() * 0.3}s;
                `;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        function showCombo(count) {
            comboDisplay.textContent = `🔥 x${count}`;
            comboDisplay.className = 'combo-display show';
            clearTimeout(comboDisplay._timeout);
            comboDisplay._timeout = setTimeout(() => {
                comboDisplay.className = 'combo-display';
            }, 600);
        }

        function showFloatingText(text, x, y) {
            const el = document.createElement('div');
            el.style.cssText = `
                position: fixed;
                left: ${x}px;
                top: ${y}px;
                transform: translate(-50%, -50%);
                color: #fff;
                font-size: 22px;
                font-weight: bold;
                text-shadow: 0 0 20px rgba(0,0,0,0.5);
                pointer-events: none;
                z-index: 99999;
                animation: floatUp 1s ease-out forwards;
                font-family: 'Segoe UI', monospace;
            `;
            el.textContent = text;
            document.body.appendChild(el);
            const style = document.createElement('style');
            style.textContent = `
                @keyframes floatUp {
                    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
                    100% { opacity: 0; transform: translate(-50%, -120px) scale(1.2); }
                }
            `;
            document.head.appendChild(style);
            setTimeout(() => { el.remove(); style.remove(); }, 1100);
        }

        function changeBackgroundByNumber(value) {
            const colors = {
                2048: '#1a1a1a',
                4096: '#0d1b3e',
                8192: '#3d0a0a',
                16384: '#2d0a3d',
                32768: '#1a0d2d'
            };
            const color = colors[value] || null;
            if (color) {
                document.body.style.background = color;
                document.body.style.transition = 'background 0.8s ease';
            }
        }

        function changeBackgroundByMerge() {
            const colors = ['#1a2a1a', '#1a1a2a', '#2a1a1a', '#1a2a2a'];
            document.body.style.background = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.transition = 'background 0.8s ease';
            showFloatingText('✨ +20 слияний!', window.innerWidth / 2, 80);
        }

        function celebrateNewNumber(value) {
            const rect = boardEl.getBoundingClientRect();
            const size = boardEl.clientWidth / SIZE;
            let cx = rect.left + rect.width / 2;
            let cy = rect.top + rect.height / 2;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === value) {
                        cx = rect.left + c * size + size / 2;
                        cy = rect.top + r * size + size / 2;
                        break;
                    }
                }
            }
            const count = Math.min(30 + Math.floor(Math.log2(value) / 2) * 4, 70);
            createFirework(cx, cy, count);
            soundCelebration();
            showFloatingText(`🎉 ${value}!`, cx, cy);
        }

        function celebrateScore(val) {
            const rect = boardEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const count = Math.min(20 + Math.floor(val / 1000) * 4, 50);
            createFirework(cx, cy, count, '#ffd700');
            showFloatingText(`⭐ ${val} очков!`, cx, cy - 30);
            soundCelebration();
        }

        function showGameOver() {
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: absolute;
                inset: 0;
                background: rgba(0,0,0,0.5);
                border-radius: 16px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                backdrop-filter: blur(4px);
            `;
            overlay.innerHTML = `
                <div style="font-size: 28px; color: #fff; font-weight: bold; margin-bottom: 8px;">💀 Игра окончена</div>
                <div style="font-size: 16px; color: #ccc; margin-bottom: 16px;">Счёт: ${Math.floor(score)}</div>
                <button onclick="this.closest('div').remove(); window._newGame();" style="
                    background: #2ecc71;
                    border: none;
                    color: #fff;
                    font-family: inherit;
                    font-size: 16px;
                    font-weight: bold;
                    padding: 10px 28px;
                    border-radius: 60px;
                    cursor: pointer;
                ">🔄 Играть снова</button>
            `;
            boardEl.appendChild(overlay);
        }

        function move(direction) {
            if (isMoving || gameOver) return;

            let moved = false;
            const newGrid = grid.map(row => [...row]);
            const merged = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
            let mergeCountThisMove = 0;
            let maxMergedValue = 0;
            let mergedPositions = [];

            const rows = [...Array(SIZE).keys()];
            const cols = [...Array(SIZE).keys()];
            if (direction === 'down') rows.reverse();
            if (direction === 'right') cols.reverse();

            for (const r of rows) {
                for (const c of cols) {
                    const val = newGrid[r][c];
                    if (val === 0) continue;

                    let dr = 0, dc = 0;
                    if (direction === 'up') dr = -1;
                    else if (direction === 'down') dr = 1;
                    else if (direction === 'left') dc = -1;
                    else if (direction === 'right') dc = 1;

                    let nr = r, nc = c;
                    while (true) {
                        const nextR = nr + dr;
                        const nextC = nc + dc;
                        if (nextR < 0 || nextR >= SIZE || nextC < 0 || nextC >= SIZE) break;
                        if (newGrid[nextR][nextC] === 0) {
                            nr = nextR;
                            nc = nextC;
                            continue;
                        }
                        if (newGrid[nextR][nextC] === val && !merged[nextR][nextC]) {
                            nr = nextR;
                            nc = nextC;
                            merged[nr][nc] = true;
                            mergeCountThisMove++;
                            maxMergedValue = Math.max(maxMergedValue, val * 2);
                            mergedPositions.push({ r: nr, c: nc, value: val * 2 });
                            break;
                        }
                        break;
                    }

                    if (nr !== r || nc !== c) {
                        moved = true;
                        if (merged[nr][nc]) {
                            newGrid[nr][nc] = val * 2;
                            score += val * 2;
                            soundMerge(val * 2);
                        } else {
                            newGrid[nr][nc] = val;
                        }
                        newGrid[r][c] = 0;
                    }
                }
            }

            // ---- ПУСТОЙ ХОД ----
            if (!moved) {
                emptyMoves++;
                if (emptyMoves >= 2) {
                    combo = 0;
                    emptyMoves = 0;
                }
                return;
            }

            // ---- ХОД СО СЛИЯНИЯМИ ----
            emptyMoves = 0;

            // КОМБО: +1 ЗА КАЖДОЕ СЛИЯНИЕ
            const comboGain = mergeCountThisMove;
            combo += comboGain;
            
            // Бонус к счёту: +0.1 за каждое слияние в комбо, макс +20 за ход
            const bonus = Math.min(combo * 0.1, 20);
            score += bonus;

            // Показываем комбо, если оно есть
            if (combo > 0) {
                showCombo(combo);
                if (combo > 1) soundCombo(combo);
            }

            // Мини-фейерверк при комбо
            if (combo >= 2) {
                const rect = boardEl.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const count = Math.min(5 + combo, 30);
                createFirework(cx, cy, count, '#ffd700');
            }

            grid = newGrid;
            soundMove();
            updateScore();

            // ---- САЛЮТЫ НА КАЖДОМ СЛИЯНИИ (НАД МЕСТОМ СЛИЯНИЯ) ----
            for (const pos of mergedPositions) {
                const rect = boardEl.getBoundingClientRect();
                const size = boardEl.clientWidth / SIZE;
                const cx = rect.left + pos.c * size + size / 2;
                const cy = rect.top + pos.r * size + size / 2;
                createFirework(cx, cy, 20, '#ff6b6b');
            }

            // ---- СЧЁТЧИК СЛИЯНИЙ ДЛЯ СМЕНЫ ФОНА ----
            mergeCount += mergeCountThisMove;
            if (mergeCount >= 20) {
                mergeCount = 0;
                changeBackgroundByMerge();
            }

            // ---- ПРОВЕРКА НА 2048 ----
            let has2048 = false;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 2048) has2048 = true;
                }
            }
            if (has2048 && !won) {
                won = true;
                soundWin();
                celebrateNewNumber(2048);
                changeBackgroundByNumber(2048);
            }

            // ---- САЛЮТ ЗА 1000 ОЧКОВ ----
            const threshold = Math.floor(score / 1000);
            if (threshold > 0 && (!window._lastThreshold || window._lastThreshold < threshold)) {
                window._lastThreshold = threshold;
                celebrateScore(threshold * 1000);
            }

            // ---- САЛЮТ ДЛЯ БОЛЬШИХ ЧИСЕЛ ----
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = grid[r][c];
                    if (val >= 4096 && val % 2 === 0) {
                        const log = Math.log2(val);
                        if (Number.isInteger(log) && log > 12) {
                            celebrateNewNumber(val);
                            changeBackgroundByNumber(val);
                        }
                    }
                }
            }

            addRandomTile();
            render();

            if (isGameOver()) {
                gameOver = true;
                soundLose();
                setTimeout(showGameOver, 300);
            }
        }

        function newGame() {
            const overlay = boardEl.querySelector('div[style*="position: absolute"]');
            if (overlay) overlay.remove();
            window._lastThreshold = 0;
            mergeCount = 0;
            combo = 0;
            emptyMoves = 0;
            document.body.style.background = isDark ? '#0a0c12' : '#f0f0f0';
            initGrid();
        }

        function setSize(size) {
            if (size === SIZE) return;
            SIZE = size;
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.size) === size);
            });
            newGame();
        }

        function toggleTheme() {
            isDark = !isDark;
            document.body.className = isDark ? 'dark' : 'light';
            themeBtn.textContent = isDark ? '☀️' : '🌙';
        }

        let touchStartX = 0, touchStartY = 0;

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                const map = {
                    'ArrowUp': 'up', 'ArrowDown': 'down',
                    'ArrowLeft': 'left', 'ArrowRight': 'right'
                };
                const dir = map[e.key];
                if (dir) {
                    e.preventDefault();
                    move(dir);
                }
            });

            boardEl.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                touchStartX = t.clientX;
                touchStartY = t.clientY;
            }, { passive: true });

            boardEl.addEventListener('touchend', (e) => {
                if (touchStartX === 0) return;
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
                if (Math.abs(dx) > Math.abs(dy)) {
                    move(dx > 0 ? 'right' : 'left');
                } else {
                    move(dy > 0 ? 'down' : 'up');
                }
                touchStartX = 0;
                touchStartY = 0;
            }, { passive: true });

            document.getElementById('newGameBtn').addEventListener('click', newGame);
            themeBtn.addEventListener('click', toggleTheme);

            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setSize(parseInt(btn.dataset.size));
                });
            });
            document.querySelector('.size-btn[data-size="4"]').classList.add('active');
        }

        window._newGame = newGame;

        function start() {
            initAudio();
            loadBest();
            setupControls();
            initGrid();
            document.body.className = 'light';
            themeBtn.textContent = '🌙';
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }
    })();
</script>
</body>
</html>
